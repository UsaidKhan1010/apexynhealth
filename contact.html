<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Apexyn</title><link rel="icon" href="./logo.png" />
  <style>body{font-family:Inter,system-ui;background:#070018;color:#fff;margin:0;padding:28px}.box{max-width:900px;margin:28px auto;background:rgba(255,255,255,0.02);padding:24px;border-radius:12px;border:1px solid rgba(138,0,255,0.05)}h1{color:#e5d2ff}label{display:block;margin-top:12px}input,textarea{width:100%;padding:10px;margin-top:6px;background:#08020f;border:1px solid rgba(255,255,255,0.04);color:#fff;border-radius:8px}button{margin-top:12px;padding:10px 14px;border-radius:8px;background:linear-gradient(90deg,#8a00ff,#5b2bff);border:none;color:white;font-weight:600}</style>
</head>
<body>
  <div class="box">
    <h1>Contact Apexyn</h1>
    <p>Prefer email? Write to <a href="mailto:apexynhealth@gmail.com">apexynhealth@gmail.com</a>.</p>

    <h3>Quick contact form</h3>
    <!-- Replace action URL with your Formspree endpoint or other form handler -->
    <form action="https://formspree.io/f/your-form-id" method="POST">
      <label for="name">Name</label>
      <input id="name" name="name" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <label for="phone">Phone</label>
      <input id="phone" name="phone" placeholder="+1-555-555-5555">

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" placeholder="Tell us about your clinic / the problem you're solving"></textarea>

      <button type="submit">Send Message</button>
    </form>

    <p style="margin-top:12px;" class="muted">If you want the form submitted directly into Google Sheets or Airtable, I’ll give you the Zapier steps next.</p>
  </div>
</body>
</html>
